# The first-render placement fixture (M60). Everything here is a shape
# examples/book/ deliberately does not have:
#   - the placement markers sit in DIFFERENT chapters, so the chapter that
#     takes on an index no marker names is not the book's last one;
#   - the book ends with TWO chapters carrying no marker at all, so the
#     chapter that reports an unplaced or doubled index section is never the
#     chapter a check gives a marker to or whose record it makes unwritable;
#   - one declared index is named by no marker anywhere, so a render has to
#     decide where it goes rather than read it off a marker;
#   - one declared index is named by no marker AND marked by nothing, so a
#     report about a section has an index with no section to overstate about
#     (M061 review F1);
#   - no chapter carries a second marker, so nothing here is about the
#     duplicate-marker rule examples/book/ already covers.
#
# HTML alone: a PDF book is one Pandoc process and has no first-render
# placement question to ask.
project:
  type: book

book:
  title: "Index Book Placement Fixture"
  chapters:
    - index.qmd
    - two.qmd
    - three.qmd
    - four.qmd
    - five.qmd

# Four declared indexes. `alpha` is placed by the marker in the FIRST chapter,
# which names no index and so places the first declared one; `beta` by the
# marker in the THIRD chapter, which names it; `gamma` by no marker at all; and
# `delta` by no marker and by nothing else either — no chapter marks a term in
# it, so it prints no section anywhere and every report about a section has to
# stay silent about it. The first declared title is deliberately not "Index",
# for the reason examples/book/ gives: a section still headed "Index" could not
# tell a declared title from the neutral one.
indexes:
  - name: alpha
    title: Index of Alpha
  - name: beta
    title: Index of Beta
  - name: gamma
    title: Index of Gamma
  - name: delta
    title: Index of Delta

filters:
  - index
