# Renders the fixture corpus on several Quarto versions and compares the index
# each one emits (M43).
#
# `_extensions/index/_extension.yml` declares `quarto-required: ">=1.4.0"` and
# README says "Quarto 1.4 or later". Until this workflow existed that was a
# claim nothing ran: `pages.yml` pins one exact version, which satisfies the
# range trivially and fences nothing about its floor.
#
# THE FLOOR. `1.4.549`. A dated observation and not a standing claim: on
# 2026-08-26 it was the oldest non-prerelease Quarto release satisfying
# `>=1.4.0`, and `v1.4.0` is no release at all. The query that returned it:
#
#     gh api --paginate repos/quarto-dev/quarto-cli/releases \
#       --jq '.[] | select(.prerelease | not) | .tag_name' \
#       | sort -V | head -5
#
# Nothing here re-runs that query, and nothing checks that 1.4.549 is still the
# oldest such release — an older one cannot appear, and a newer floor is a
# decision, not a fact to be detected.
#
# This workflow is deliberately NOT part of `pages.yml`. A red floor render
# there would block the site from publishing, and the floor's health has
# nothing to do with whether the documentation is servable; here it reports
# itself and stops.
#
# The release-channel leg runs weekly and on demand rather than on every push.
# The floor and pinned legs are exact versions, so their red always traces to a
# commit; a channel leg can go red on an upstream release alone, which is not a
# signal a push is answerable for.
#
# Two narrow reads of this file run in the acceptance suite, and nothing else
# here is checked. `tests/versioncheck.py floor` reads the `FLOOR:` line below
# and holds README and the site's Tests page to the version it names.
# `tests/versioncheck.py fixtures` reads the `indexdump.py html` invocations in
# the render step and the extraction each is redirected into, and holds that
# set of fixture names equal to the set the suite dumps locally. Each says in
# its own header what it reads and what it does not.
#
# Nothing else about these steps is checked, and widening either read is
# refused: D-011 declines a scan that pins names and shapes in a source file it
# does not execute, because such a scan certifies a property it never asserts.
# The evidence that the steps work is the runs themselves, including the
# deliberately red ones recorded in the milestone's Review section, as it was
# for `pages.yml`.
name: Versions

on:
  push:
  schedule:
    # Weekly, Mondays. The minute is off the hour: GitHub drops scheduled runs
    # at popular times under load.
    - cron: '37 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Which versions this run renders on. A job of its own because the pinned
  # leg's version is not written here: it is read out of `pages.yml`, so that
  # "the version the Pages workflow installs" stays true when that pin moves
  # instead of leaving a second copy of the number here to drift.
  plan:
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Work out which Quarto versions this run renders on
        id: legs
        shell: bash
        env:
          # The floor, stated once, in the file whose header records where it
          # came from and when.
          FLOOR: '1.4.549'
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          PINNED=$(python3 tests/pagescheck.py version .github/workflows/pages.yml)
          # `versioncheck` writes its FAIL line to stdout, and stdout here is
          # captured into the matrix rather than printed. Left as a bare
          # capture, a refused matrix kills the step under `set -e` with the
          # reason sitting unread in $LEGS; this puts it in the log.
          if ! LEGS=$(python3 tests/versioncheck.py legs "$FLOOR" "$PINNED" "$EVENT"); then
            printf '%s\n' "$LEGS" >&2
            exit 1
          fi
          printf 'legs=%s\n' "$LEGS" >> "$GITHUB_OUTPUT"
          printf 'rendering on: %s\n' "$LEGS"

  render:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # A red leg must not cancel the others: which legs agree is the whole
      # question, and a cancelled leg uploads nothing for the comparison to
      # read.
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Quarto ${{ matrix.leg.version }}
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ matrix.leg.version }}

      # This matrix renders the fixtures to HTML and compares the HTML index
      # each leg emits, and nothing else. It renders no PDF, and so installs
      # no TeX and no extraction tool for one.
      #
      # That is deliberate. Two Quarto releases typeset PDF through different
      # TeX engines, and the M30 and M33 lessons put engine and font
      # differences in a PDF's text layer, so a comparison of PDF content
      # would be red about the engine rather than about this extension.
      # Comparing the fixture NAMES alone was tried instead (M45), and bought
      # no coverage beyond what the PDF render it needed was already giving.
      # That render is what M47 removed: it put a hardcoded third-party TeX
      # repository and a self-updating TeX package manager on the every-push
      # path, and no leg has typeset a fixture since. Restoring a PDF leg waits
      # on an extraction shown engine-neutral across lualatex and xelatex.
      #
      # Each render below is followed immediately by its extraction. With one
      # format the four renders write four distinct paths and none can overtake
      # another; the ordering is kept because a second format would render into
      # a path an earlier one already wrote — the book renders into `_book`
      # whatever the format — and the interleaving is what made that safe.
      #
      # `indexdump.py` is what makes each of these a check and not just a
      # render: it fails loudly on an artifact carrying no index, so a leg that
      # rendered at exit 0 having printed nothing is red here rather than
      # uploading an empty extraction for the comparison to agree with.
      - name: Render the fixtures and extract each index
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/extract"
          mkdir -p "$OUT"

          quarto render examples/html-index.qmd --to html
          python3 tests/indexdump.py html examples/html-index.html \
            > "$OUT/html-index.html.txt"

          quarto render examples/named-indexes.qmd --to html
          python3 tests/indexdump.py html examples/named-indexes.html \
            > "$OUT/named-indexes.html.txt"

          quarto render examples/demo.qmd --to html
          python3 tests/indexdump.py html examples/demo.html \
            > "$OUT/demo.html.txt"

          ( cd examples/book && quarto render --to html )
          python3 tests/indexdump.py html examples/book/_book/last.html \
            > "$OUT/book.html.txt"

          wc -l "$OUT"/*.txt

      - name: Upload this leg's extractions
        uses: actions/upload-artifact@v4
        with:
          name: index-${{ matrix.leg.name }}
          path: ${{ runner.temp }}/extract
          if-no-files-found: error

  compare:
    needs: [plan, render]
    # `needs` gates on success by default, so one red leg would skip the job
    # that reports the verdict — `fail-fast: false` keeps the other legs
    # rendering and uploading, and then nobody is told whether they agreed.
    # The comparison's own clauses report a leg that uploaded nothing as a leg
    # that uploaded nothing, so running here over whatever landed is a reading
    # and never a false green.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download every leg's extractions
        uses: actions/download-artifact@v4
        with:
          path: legs
          pattern: index-*

      # The comparison's own reader, so that which fixture and which leg pair
      # differed is in the log rather than in a bare `diff` exit status. It
      # reports the size of every domain it sweeps, so a run whose legs failed
      # to upload reads as legs missing and never as agreement.
      - name: Compare each leg's HTML index against the pinned leg's
        run: python3 tests/versioncheck.py compare legs pinned
