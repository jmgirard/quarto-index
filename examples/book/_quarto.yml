# The book fixture (M05). Four chapters, the last one carrying the placement
# marker, so the aggregated index is built where the author asked for it.
#
# The shapes here are load-bearing for the acceptance manifests: a term marked
# in three chapters, a chapter in a subdirectory, a cross-reference whose
# target another chapter contributes, and a mark in the marker chapter itself.
project:
  type: book

book:
  title: "Index Book Fixture"
  chapters:
    - index.qmd
    - one.qmd
    - sub/two.qmd
    - last.qmd

format:
  html: default
  pdf: default
  epub: default

# Three declared indexes, for the three properties a book has to show about
# them (M55). `main` is placed by the marker that names none, `people` by the
# marker that names it — both in last.qmd — and `places` by no marker at all,
# so it is appended after them and pins where an unasked-for index goes. The
# FIRST declared title is deliberately not "Index": a book heads each section
# with the title its author declared, so a first index still headed "Index"
# could not tell a declared title from the neutral one.
#
# The same declaration serves every format: a PDF book is one Pandoc process
# and an HTML book aggregates its chapters through a sidecar store that carries
# the index each mark files in, so both build every index declared here.
indexes:
  - name: main
    title: Index of Subjects
  - name: people
    title: Index of People
  - name: places
    title: Index of Places

filters:
  - index
