# Renders the fixture corpus on several Quarto versions and compares the index
# each one emits (M43).
#
# `_extensions/index/_extension.yml` declares `quarto-required: ">=1.4.0"` and
# README says "Quarto 1.4 or later". Until this workflow existed that was a
# claim nothing ran: `pages.yml` pins one exact version, which satisfies the
# range trivially and fences nothing about its floor.
#
# THE FLOOR. `1.4.549`. A dated observation and not a standing claim: on
# 2026-08-26 it was the oldest non-prerelease Quarto release satisfying
# `>=1.4.0`, and `v1.4.0` is no release at all. The query that returned it:
#
#     gh api --paginate repos/quarto-dev/quarto-cli/releases \
#       --jq '.[] | select(.prerelease | not) | .tag_name' \
#       | sort -V | head -5
#
# Nothing here re-runs that query, and nothing checks that 1.4.549 is still the
# oldest such release — an older one cannot appear, and a newer floor is a
# decision, not a fact to be detected.
#
# This workflow is deliberately NOT part of `pages.yml`. A red floor render
# there would block the site from publishing, and the floor's health has
# nothing to do with whether the documentation is servable; here it reports
# itself and stops.
#
# The release-channel leg runs weekly and on demand rather than on every push.
# The floor and pinned legs are exact versions, so their red always traces to a
# commit; a channel leg can go red on an upstream release alone, which is not a
# signal a push is answerable for.
#
# The PDF job below is off the push path for the same shape of reason and a
# different cause: it installs a TeX distribution and a package from a named
# third-party repository, and that install's red traces to upstream mirror
# state rather than to a commit (M51). Which events it runs on is not written
# as an `if:` naming them here — `tests/versioncheck.py pdf` decides, the
# `plan` job captures the answer, and the job gates on that output, so all
# three answers are readable in the acceptance suite instead of costing one
# dispatched run apiece.
#
# Two narrow reads of this file run in the acceptance suite, and nothing else
# here is checked. `tests/versioncheck.py floor` reads the `FLOOR:` line below
# and holds README and the site's Tests page to the version it names.
# `tests/versioncheck.py fixtures` reads every `indexdump.py html` invocation
# in this file and the extraction each is redirected into, and holds that set
# of fixture names equal to the set the suite dumps locally. It reads the file
# whole rather than the render step alone, so an invocation of that shape in
# any job joins the set. Each says in its own header what it reads and what it
# does not.
#
# Nothing else about these steps is checked, and widening either read is
# refused: D-011 declines a scan that pins names and shapes in a source file it
# does not execute, because such a scan certifies a property it never asserts.
# The evidence that the steps work is the runs themselves, including the
# deliberately red ones recorded in the milestone's Review section, as it was
# for `pages.yml`.
name: Versions

on:
  push:
  schedule:
    # Weekly, Mondays. The minute is off the hour: GitHub drops scheduled runs
    # at popular times under load.
    - cron: '37 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Which versions this run renders on. A job of its own because the pinned
  # leg's version is not written here: it is read out of `pages.yml`, so that
  # "the version the Pages workflow installs" stays true when that pin moves
  # instead of leaving a second copy of the number here to drift.
  plan:
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
      pdf: ${{ steps.legs.outputs.pdf }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Work out which Quarto versions this run renders on
        id: legs
        shell: bash
        env:
          # The floor, stated once, in the file whose header records where it
          # came from and when.
          FLOOR: '1.4.549'
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          PINNED=$(python3 tests/pagescheck.py version .github/workflows/pages.yml)
          # `versioncheck` writes its FAIL line to stdout, and stdout here is
          # captured into the matrix rather than printed. Left as a bare
          # capture, a refused matrix kills the step under `set -e` with the
          # reason sitting unread in $LEGS; this puts it in the log.
          if ! LEGS=$(python3 tests/versioncheck.py legs "$FLOOR" "$PINNED" "$EVENT"); then
            printf '%s\n' "$LEGS" >&2
            exit 1
          fi
          printf 'legs=%s\n' "$LEGS" >> "$GITHUB_OUTPUT"
          printf 'rendering on: %s\n' "$LEGS"
          # The PDF job's gate. Its reader writes any diagnostic to stderr and
          # leaves stdout empty, so a bare capture here cannot pick one up as
          # the answer; `set -e` and the explicit test below stop the run
          # rather than letting an empty output read as `not true`.
          PDF=$(python3 tests/versioncheck.py pdf "$EVENT")
          if [ "$PDF" != true ] && [ "$PDF" != false ]; then
            echo "FAIL: the PDF gate answered <<$PDF>>, which is neither" >&2
            exit 1
          fi
          printf 'pdf=%s\n' "$PDF" >> "$GITHUB_OUTPUT"
          printf 'rendering PDF: %s\n' "$PDF"

  render:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # A red leg must not cancel the others: which legs agree is the whole
      # question, and a cancelled leg uploads nothing for the comparison to
      # read.
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Quarto ${{ matrix.leg.version }}
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ matrix.leg.version }}

      # This job renders the fixtures to HTML, and the comparison below is
      # over that HTML alone. It renders no PDF and installs no TeX; the PDF
      # job at the end of this file does that, on its own schedule.
      #
      # Nothing here compares a PDF, and the PDF job compares nothing either.
      # That is deliberate. Two Quarto releases typeset PDF through different
      # TeX engines, and the M30 and M33 lessons put engine and font
      # differences in a PDF's text layer, so a comparison of PDF content
      # would be red about the engine rather than about this extension.
      # Comparing the fixture NAMES alone was tried instead (M45), and bought
      # no coverage beyond what the PDF render it needed was already giving.
      # A cross-leg PDF comparison waits on an extraction shown engine-neutral
      # across lualatex and xelatex, and is no part of what M51 restored.
      #
      # Each render below is followed immediately by its extraction. With one
      # format the four renders write four distinct paths and none can overtake
      # another; the ordering is kept because a second format would render into
      # a path an earlier one already wrote — the book renders into `_book`
      # whatever the format — and the interleaving is what made that safe.
      #
      # `indexdump.py` is what makes each of these a check and not just a
      # render: it fails loudly on an artifact carrying no index, so a leg that
      # rendered at exit 0 having printed nothing is red here rather than
      # uploading an empty extraction for the comparison to agree with.
      - name: Render the fixtures and extract each index
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/extract"
          mkdir -p "$OUT"

          quarto render examples/html-index.qmd --to html
          python3 tests/indexdump.py html examples/html-index.html \
            > "$OUT/html-index.html.txt"

          quarto render examples/named-indexes.qmd --to html
          python3 tests/indexdump.py html examples/named-indexes.html \
            > "$OUT/named-indexes.html.txt"

          quarto render examples/demo.qmd --to html
          python3 tests/indexdump.py html examples/demo.html \
            > "$OUT/demo.html.txt"

          ( cd examples/book && quarto render --to html )
          python3 tests/indexdump.py html examples/book/_book/last.html \
            > "$OUT/book.html.txt"

          wc -l "$OUT"/*.txt

      - name: Upload this leg's extractions
        uses: actions/upload-artifact@v4
        with:
          name: index-${{ matrix.leg.name }}
          path: ${{ runner.temp }}/extract
          if-no-files-found: error

  compare:
    needs: [plan, render]
    # `needs` gates on success by default, so one red leg would skip the job
    # that reports the verdict — `fail-fast: false` keeps the other legs
    # rendering and uploading, and then nobody is told whether they agreed.
    # The comparison's own clauses report a leg that uploaded nothing as a leg
    # that uploaded nothing, so running here over whatever landed is a reading
    # and never a false green.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download every leg's extractions
        uses: actions/download-artifact@v4
        with:
          path: legs
          pattern: index-*

      # The comparison's own reader, so that which fixture and which leg pair
      # differed is in the log rather than in a bare `diff` exit status. It
      # reports the size of every domain it sweeps, so a run whose legs failed
      # to upload reads as legs missing and never as agreement.
      - name: Compare each leg's HTML index against the pinned leg's
        run: python3 tests/versioncheck.py compare legs pinned

  # The PDF leg. It renders the two PDF fixtures on every version this run
  # planned and fails when either prints no index — nothing more. It compares
  # nothing across legs and uploads nothing: its extractions are written under
  # a directory of its own, outside the one the render job's upload names, so
  # a step added here cannot join that upload and be read by the comparison as
  # a leg's HTML extraction.
  #
  # WHAT IT CHECKS. That `quarto render --to pdf` succeeds on both fixtures
  # under this leg's Quarto, and that `tests/indexdump.py pdf` finds a printed
  # index with at least one entry in each rendered PDF. The render alone is
  # not the check: a PDF that typesets at exit 0 while the index prints empty
  # is exactly the break this job exists to catch, and `indexdump.py` is what
  # makes the difference between the two visible.
  #
  # WHAT IT DELIBERATELY DOES NOT CHECK. Whether two legs print the SAME
  # index — see the render job's note above on why a PDF comparison would be
  # red about the TeX engine. The extension's own named-index fixture, whose
  # second index is built under TeX's restricted shell escape (D-031) and
  # whose failure mode would be an installation's rather than a Quarto
  # version's. And the acceptance suite, which pins a PDF engine and so
  # cannot run green on the floor leg at all.
  #
  # It runs only where `tests/versioncheck.py pdf` said so, which the `plan`
  # job captured — a scheduled or manually dispatched run, and not a push.
  # These steps ran on every push until M47 removed them; what M51 restores is
  # the renders, not the schedule they ran on.
  #
  # It needs no ordering against the render job: the two share no artifact,
  # and running them together is what keeps a scheduled run's wall clock the
  # slower of the two rather than their sum.
  pdf:
    needs: plan
    if: needs.plan.outputs.pdf == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Same reason as the render job: which legs typeset is the question, and
      # a cancelled leg answers it for nobody.
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # `quarto install tinytex` asks the GitHub API which TinyTeX release is
      # current, and unauthenticated that call is rate-limited per runner
      # address (pages.yml records a 403 on one of six runs started together).
      # The run's own token authenticates it.
      - name: Install Quarto ${{ matrix.leg.version }} and TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: ${{ matrix.leg.version }}
          tinytex: true

      # `imakeidx`, which the LaTeX back-end loads. It is installed HERE, with
      # the runner's own TinyTeX, rather than left to Quarto's on-demand
      # installer: Quarto 1.4.549 answers `compilation failed- no matching
      # packages` when it goes looking for `imakeidx.sty` against today's TeX
      # Live repository, which turned the floor leg red on two runs out of
      # three while this workflow was first being proved. Run on every leg and
      # not only the floor one, so the legs differ in their Quarto version and
      # in nothing else.
      #
      # `tlmgr` is not on the runner's PATH: `quarto install tinytex` puts the
      # distribution under `~/.TinyTeX` and Quarto locates it itself. Its bin
      # directory is found rather than named — TeX Live's platform directory is
      # `x86_64-linux` on one release and `universal-linux` on another — and a
      # tree with no bin directory is a loud failure, never a silently skipped
      # install. The PATH change is local to this step, so the renders below
      # still reach TeX exactly the way Quarto arranges it.
      - name: Install the TeX packages the PDF fixtures load
        run: |
          set -euo pipefail
          TLBIN=$(find "$HOME/.TinyTeX/bin" -mindepth 1 -maxdepth 1 -type d \
            | head -1)
          if [ -z "$TLBIN" ]; then
            echo "FAIL: no TeX Live bin directory under $HOME/.TinyTeX/bin" >&2
            exit 1
          fi
          export PATH="$TLBIN:$PATH"
          tlmgr --version | head -1
          # The repository is named rather than left to `mirror.ctan.org`'s
          # redirect: that redirect handed the two legs different mirrors on
          # one run, and the floor leg's was stale enough that `tlmgr` refused
          # to run at all ("seems to be older than the local installation").
          # This is TinyTeX's own default repository, which the runs that
          # worked were already using.
          tlmgr option repository https://tlnet.yihui.org
          # The installed tlmgr is older than the repository it talks to and
          # refuses to install anything until it updates itself.
          tlmgr update --self
          tlmgr install imakeidx
          kpsewhich imakeidx.sty

      # `pdftotext`, which tests/pdfindex.py reads a printed index through.
      # TinyTeX does not carry it and the runner image is not relied on to.
      - name: Install poppler-utils
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      # `$RUNNER_TEMP/pdf`, not the `$RUNNER_TEMP/extract` the render job
      # uploads: this job's extractions are read by the step that writes them
      # and by nothing else, and a shared directory would invite a later step
      # to upload one of them under a leg's artifact name, where the
      # comparison reads `*.html.txt` and would find a file it never rendered.
      #
      # Each render is a step and each extraction is the step after it, rather
      # than one step running all four commands. That is what makes a red
      # readable: a fixture that typesets and prints no index is the break
      # this job exists to catch, and it shows here as a green render step
      # followed by a red extraction step. Run together under `set -e` the
      # same break is one red step, which a reader cannot tell from a render
      # that failed to typeset at all.
      #
      # The order is render, extract, render, extract, and not both renders
      # then both extractions: the book renders into `_book` whatever the
      # format, so a second render into that directory replaces the first, and
      # keeping each extraction beside its own render is what survives a
      # second format being added here.
      - name: Make the directory this job's extractions are written to
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/pdf"

      - name: Render examples/demo.qmd to PDF
        shell: bash
        run: |
          set -euo pipefail
          quarto render examples/demo.qmd --to pdf

      - name: Extract the index printed in examples/demo.pdf
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/indexdump.py pdf examples/demo.pdf \
            > "$RUNNER_TEMP/pdf/demo.pdf.txt"

      - name: Render examples/book to PDF
        shell: bash
        run: |
          set -euo pipefail
          ( cd examples/book && quarto render --to pdf )

      # The two headings are the book's own declared titles, read by hand off
      # `examples/book/_quarto.yml` — the same hand-read the acceptance suite
      # makes at its own book-PDF probe. `indexdump.py pdf` defaults to a
      # heading of `Index`, which this book has not printed since M49 gave it
      # two named indexes with titles of their own; the second title is passed
      # as the stop line so the first index's entries are read and the second
      # index's are not folded in after them.
      #
      # This reads the FIRST declared index and not both. The question here is
      # whether a Quarto version typesets the book and prints an index in it;
      # what a second declared index does under TeX's restricted shell escape
      # is D-031's subject and no part of what this job asks.
      - name: Extract the index printed in the book's PDF
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/indexdump.py pdf \
            examples/book/_book/Index-Book-Fixture.pdf \
            'Index of Subjects' 'Index of People' \
            > "$RUNNER_TEMP/pdf/book.pdf.txt"

      - name: Report what this leg extracted
        shell: bash
        run: wc -l "$RUNNER_TEMP/pdf"/*.txt
