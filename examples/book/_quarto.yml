# The book fixture (M05). Four chapters, the last one carrying the placement
# marker, so the aggregated index is built where the author asked for it.
#
# The shapes here are load-bearing for the acceptance manifests: a term marked
# in three chapters, a chapter in a subdirectory, a cross-reference whose
# target another chapter contributes, and a mark in the marker chapter itself.
project:
  type: book

book:
  title: "Index Book Fixture"
  chapters:
    - index.qmd
    - one.qmd
    - sub/two.qmd
    - last.qmd

format:
  html: default
  pdf: default

# Two declared indexes (M38), for the two properties a book has to show about
# them. An HTML book aggregates its chapters through a sidecar store whose
# record format carries no index name, so every named mark and every named
# marker is folded into the one index the HTML book builds, and each is told
# so. And the FIRST declared title is deliberately not "Index": the one section
# a folded HTML book prints holds every declared index's marks, so it is headed
# with the neutral title rather than with this one, which would claim the
# section is the subject index alone (M38 R3).
#
# A PDF book is one Pandoc process and folds nothing (M49): it prints both
# declarations, each under its own title, so the same file is also the fixture
# for a book that builds every index it declares.
indexes:
  - name: main
    title: Index of Subjects
  - name: people
    title: Index of People

filters:
  - index
